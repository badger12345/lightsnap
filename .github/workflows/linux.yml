# Builds the Linux packages (x86_64 and arm64). Runs by hand and for every version
# tag; for a tag it also attaches the packages to that release, if it exists.
name: Linux

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libxkbcommon-dev libdbus-1-dev

      - name: Install Rust and cargo-about
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install --locked --features cli cargo-about

      - name: Test
        run: cargo test --locked

      - name: Build the package
        run: ./scripts/bundle-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lightsnap-linux-${{ runner.arch }}
          path: dist/*.tar.gz

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
          else
            echo "No release $GITHUB_REF_NAME yet; the packages are in the run's artifacts."
          fi
